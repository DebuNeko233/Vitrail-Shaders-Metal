# This metadata describes the NeoForge half of the build, and that half is NOT a working product.
# Vitrail draws shader packs only through Metallum on Apple Metal, and Metallum ships a Fabric mod
# alone, so no Metal provider exists on this loader for a device or a command submission to come
# from. The source is kept for a possible future port and is not published as something that works.
# What says so is the description below, because NeoForge metadata has no field for "not published",
# "unmaintained" or "experimental": there is no key here that a mod list, a launcher or a store would
# read as any of those, and inventing a fake dependency to signal it would only refuse a launch with
# a reason that is untrue.

modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-3.0-only"
issueTrackerURL = "https://github.com/avpbynf/Vitrail-Shaders/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Vitrail"
displayURL = "https://github.com/avpbynf/Vitrail-Shaders"
logoFile = "vitrail.png"
authors = "avpbynf"
displayTest = "IGNORE_ALL_VERSION"
description = '''OptiFine-format shader packs on Minecraft's Metal renderer, through Metallum. This NeoForge build is not a working product: Metallum publishes no NeoForge distribution, so no Metal provider exists on this loader and no shader pack can be drawn. The source is kept for a possible future port.'''

# Sodium reads this block out of every mod's own metadata and turns the named mixin off.
# features.render.world.sky hides the whole sky pass whenever the camera is in a fluid, which with a
# pack loaded means no sky at all: none of the six elements is drawn, so none of the pack's sky
# programs runs. LevelRendererSkyMixin puts the same answer back where no pack draws the sky.
[mods."sodium:options"]
"mixin.features.render.world.sky" = false

# The class Sodium builds to be handed its config builder, which is where the settings screen is put
# into the video settings. Sodium reads it from the metadata here and from an entry point in
# fabric.mod.json on the other side; it also offers an annotation of its own for this, and the
# metadata is taken instead because it leaves the class free of anything either loader brings.
# This block is the mod's own properties and is read by mod id, so it does not belong under the
# [[mods]] entry above however much it looks like it should.
[modproperties.${mod_id}]
"sodium:config_api_user" = "dev.vitrail.sodium.ConfigEntry"

[[mixins]]
config = "vitrail.mixins.json"

# The engine's own mixins are in the common module and are listed above. This second config is
# the handful that exist on this loader alone, which today is the refusal of the early loading
# window: it names classes of NeoForge's, so it could not live where the Fabric module reads.
[[mixins]]
config = "vitrail-neoforge.mixins.json"

# There is deliberately no Metallum dependency below, and it is deliberately not a declaration with a
# made-up mod id: Metallum has no NeoForge distribution, so there is no mod id on this loader to
# depend on. A required entry naming one that cannot be installed would stop the loader at the mod
# list with a reason that is false, which is worse than the honest description above.
[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},26.3)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_min_version},26.3)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "sodium"
type = "required"
reason = "Vitrail renders through Sodium, which owns the command submission."
versionRange = "[0.9,0.10)"
ordering = "AFTER"
side = "CLIENT"
