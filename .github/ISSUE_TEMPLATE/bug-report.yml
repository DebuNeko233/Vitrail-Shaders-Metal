name: Something else is broken
description: A crash, a game that will not start, or anything that is not a pack drawing wrongly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A world that looks entirely like vanilla is most often a session that did not come up on
        Metal, which
        [INSTALL.md](https://github.com/avpbynf/Vitrail-Shaders/blob/main/INSTALL.md) covers,
        along with the ways that failure hides itself. This engine draws on Metal alone, through
        Metallum, so what the log says at startup about the backend, about Metallum and about the
        device is the first thing worth reading.

  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: The log
      description: >
        `logs/latest.log`, attached as a file. For a crash, the file under `crash-reports/` as well.
        The log's first line names the version that is actually running.
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Vitrail and its loader, Minecraft, Sodium, Metallum, and anything else in `mods/`.
      placeholder: Vitrail 0.13.0 on Fabric, MC 26.2, Sodium 0.9.2, Metallum 0.0.24
    validations:
      required: true

  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      description: >
        The Apple Silicon model and the macOS version. Metal is the only backend this engine draws
        on, and it runs on macOS on Apple Silicon, so this is the line that tells.
      placeholder: MacBook Pro (M3 Max), macOS 26.1
    validations:
      required: true

  - type: input
    id: metallum
    attributes:
      label: Metallum version or commit
      description: >
        The version or commit of Metallum in `mods/`. It is required rather than optional: the game
        starts without it, and this engine then draws no pack at all.
      placeholder: Metallum 0.0.24
    validations:
      required: true

  - type: input
    id: metal_api
    attributes:
      label: Metal API generation
      description: >
        What Vitrail's debug screen reports for this session, both the generation the frames are
        encoded through and the newest one the device answers for. The two can differ, and the first
        is the one that says what actually ran.
      placeholder: Frames through Metal 3; device answers Metal 4
    validations:
      required: true

  - type: input
    id: pack
    attributes:
      label: Shader pack and settings, if one is loaded
      description: >
        The pack's name and version, and every setting you moved away from what the pack ships.
        Leave this out when no pack is involved.
      placeholder: BSL v10.1.3, shadow quality High

  - type: dropdown
    id: without
    attributes:
      label: Does it still happen with Vitrail taken out?
      description: >
        Sodium on its own, on Metal, with the same pack folder in place. It separates this engine
        from the mods it cannot run without.
      options:
        - It stops when Vitrail is out
        - It happens without Vitrail too
        - Not tried
    validations:
      required: true
