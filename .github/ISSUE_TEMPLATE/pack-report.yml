name: A pack does not draw as it should
description: An image that is wrong, missing, or unlike the same pack elsewhere.
labels: ["pack compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Two things close most of these, and both are quicker than this form.

        [Pack compatibility](https://github.com/avpbynf/Vitrail-Shaders/blob/main/docs/compatibility.md)
        starts from what you are seeing and names the cause. Several of the shapes that get reported
        are the game's own behaviour or the pack's default settings rather than this engine, and that
        page says how to tell which.

        And what this engine is known to be missing is
        [open as issues already](https://github.com/avpbynf/Vitrail-Shaders/issues?q=is%3Aissue+is%3Aopen+label%3A%22known+limitation%22).
        A symptom that matches one of them is worth a comment there, where it will be read against
        the rest of that gap, rather than a report of its own.

        The log matters more here than the description does. This engine draws such a pack on Metal
        alone, through Metallum, and the log says at load which backend it is on, what it refused,
        what it could not serve, and which program it chose for each pass, so most of what you are
        about to write is already in it, in words, at the moment it happened.

  - type: input
    id: pack
    attributes:
      label: The pack, and its version
      placeholder: BSL v10.1.3
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: The pack's settings
      description: >
        Every setting you moved away from what the pack ships, and any it turns off by default. A
        pass that a setting left switched off never ran, and that is not a pack this engine drew
        wrongly.
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: What you see
      description: >
        What the picture does, and where it does it: a dimension, a time of day, standing under
        water, whatever it takes for somebody else to stand where you are standing. Screenshots go
        here, and one of the same spot with the pack running on Iris is worth more than any
        description of the difference.
    validations:
      required: true

  - type: dropdown
    id: reference
    attributes:
      label: Does the same pack do this on Iris?
      description: >
        Iris is what this engine is measured against, so a pack behaving the same way there is
        behaving as it was written to, and the answer is in the pack rather than here. Not having
        tried is a fine answer.
      options:
        - It draws correctly on Iris
        - It does the same on Iris
        - Not tried
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: The log
      description: >
        `logs/latest.log` from the session you saw it in, attached as a file rather than pasted. Its
        first line names the version that is actually running, which is not always the one you meant
        to install.
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Vitrail and its loader, Minecraft, Sodium, Metallum, and anything else in `mods/`.
      placeholder: Vitrail 0.13.0 on Fabric, MC 26.2, Sodium 0.9.2, Metallum 0.0.24
    validations:
      required: true

  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      description: >
        The Apple Silicon model and the macOS version. Metal is the only backend this engine draws
        on, and it runs on macOS on Apple Silicon, so this is the line that tells.
      placeholder: MacBook Pro (M3 Max), macOS 26.1
    validations:
      required: true

  - type: input
    id: metallum
    attributes:
      label: Metallum version or commit
      description: >
        The version or commit of Metallum in `mods/`. It is required rather than optional: the game
        starts without it, and this engine then draws no pack at all.
      placeholder: Metallum 0.0.24
    validations:
      required: true

  - type: input
    id: metal_api
    attributes:
      label: Metal API generation
      description: >
        What Vitrail's debug screen reports for this session, both the generation the frames are
        encoded through and the newest one the device answers for. The two can differ, and the first
        is the one that says what actually ran.
      placeholder: Frames through Metal 3; device answers Metal 4
    validations:
      required: true

  - type: checkboxes
    id: preflight
    attributes:
      label: Before reporting
      description: Every one of these has produced a report that turned out not to be a defect.
      options:
        - label: >
            The log shows the session came up on Metal with a compatible Metallum. This engine draws
            no pack on any other backend, so a session that did not reach Metal draws the game's own
            image, and that alone explains a pack that looks missing.
          required: true
        - label: >
            The pack's own setting for the effect is on. Depth of field, motion blur and custom sun
            discs are routinely shipped switched off, and a pass that never ran is not a pass that
            failed.
          required: true
        - label: >
            The world was rebuilt after the pack changed, and not merely reloaded. Block numbers
            travel on the vertex and no two packs number them alike, so nothing seen before that
            rebuild means anything.
          required: true
