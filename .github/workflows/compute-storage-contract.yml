name: compute-storage-contract
run-name: ${{ github.ref_name }}

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compute-storage-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify Apple Silicon runner
        run: |
          uname -a
          test "$(uname -m)" = "arm64"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: validate PHASE 15 Compute / Storage contracts
        run: |
          python3 tests/test_compute_storage_contract.py
          java tests/VerifyComputeStorageScreenshot.java --self-test
